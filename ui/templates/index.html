<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Agent Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* 自定义滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* 消息动画 */
      .message-enter {
        animation: slideIn 0.3s ease-out forwards;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 打字光标闪烁 */
      .cursor-blink::after {
        content: "▋";
        animation: blink 1s step-end infinite;
        color: #3b82f6;
        margin-left: 2px;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 h-screen flex flex-col font-sans text-slate-800">
    <!-- 头部导航 -->
    <header
      class="bg-white shadow-sm border-b border-slate-200 px-6 py-4 flex items-center justify-between z-10"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-200"
        >
          <i class="fa-solid fa-robot text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-800">Go Agent Studio</h1>
          <p class="text-xs text-slate-500">Powered by Gin & SSE</p>
        </div>
      </div>
      <button
        onclick="clearChat()"
        class="text-slate-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50"
      >
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </header>

    <!-- 聊天区域 -->
    <main
      id="chat-container"
      class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth"
    >
      <!-- 欢迎消息 -->
      <div class="flex gap-4 max-w-3xl mx-auto message-enter">
        <div
          class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs"
        >
          <i class="fa-solid fa-robot"></i>
        </div>
        <div
          class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm leading-relaxed text-slate-700"
        >
          👋 你好！我是基于 Go Gin
          框架开发的智能助手。支持流式输出，体验丝滑。试着问我一些问题吧！
        </div>
      </div>
    </main>

    <!-- 输入区域 -->
    <footer class="bg-white border-t border-slate-200 p-4 pb-6">
      <div class="max-w-3xl mx-auto relative">
        <form
          id="chat-form"
          class="relative flex items-end gap-2 bg-slate-100 p-2 rounded-xl border border-slate-200 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition-all"
        >
          <textarea
            id="user-input"
            rows="1"
            class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 px-3 text-sm max-h-32 outline-none text-slate-700 placeholder-slate-400"
            placeholder="输入消息..."
            oninput="
              this.style.height = '';
              this.style.height = this.scrollHeight + 'px';
            "
            onkeydown="handleKeyDown(event)"
          ></textarea>
          <button
            type="submit"
            id="send-btn"
            class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-blue-200 mb-0.5"
          >
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
        <p class="text-center text-xs text-slate-400 mt-2">
          AI 生成内容仅供参考，请核实重要信息。
        </p>
      </div>
    </footer>

    <script>
      const chatContainer = document.getElementById("chat-container");
      const userInput = document.getElementById("user-input");
      const chatForm = document.getElementById("chat-form");
      const sendBtn = document.getElementById("send-btn");
      let isGenerating = false;
      let history = [];

      function handleKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          chatForm.requestSubmit();
        }
      }

      function appendMessage(role, content, isStream = false) {
        const div = document.createElement("div");
        div.className = "flex gap-4 max-w-3xl mx-auto message-enter";

        const isUser = role === "user";
        const avatarBg = isUser
          ? "bg-slate-200 text-slate-600"
          : "bg-blue-600 text-white";
        const icon = isUser
          ? '<i class="fa-solid fa-user"></i>'
          : '<i class="fa-solid fa-robot"></i>';
        const bubbleBg = isUser
          ? "bg-blue-600 text-white rounded-tr-none"
          : "bg-white text-slate-700 rounded-tl-none border border-slate-100";

        div.innerHTML = `
                <div class="w-8 h-8 ${avatarBg} rounded-full flex-shrink-0 flex items-center justify-center text-xs">
                    ${icon}
                </div>
                <div class="${bubbleBg} p-4 rounded-2xl shadow-sm text-sm leading-relaxed break-words min-w-[100px]">
                    <span class="message-content whitespace-pre-wrap"></span>
                    ${isStream && !isUser ? '<span class="cursor-blink"></span>' : ""}
                </div>
            `;

        chatContainer.appendChild(div);
        div.querySelector(".message-content").textContent = content;
        scrollToBottom();
        return div.querySelector(".message-content");
      }

      function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function clearChat() {
        if (confirm("确定清空聊天记录吗？")) {
          history = [];
          chatContainer.innerHTML = "";
          // 重新添加欢迎语
          appendMessage("assistant", "聊天记录已清空。有什么新问题吗？");
        }
      }

      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message || isGenerating) return;

        // 1. 显示用户消息
        appendMessage("user", message);
        history.push({ role: "user", content: message });
        userInput.value = "";
        userInput.style.height = "auto";
        isGenerating = true;
        sendBtn.disabled = true;
        sendBtn.classList.add("opacity-50");

        // 2. 创建 AI 消息占位符
        const aiContentSpan = appendMessage("assistant", "", true);
        let fullText = "";

        try {
          // 3. 发起 SSE 请求
          const response = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message, history: history.slice(0, -1) }),
          });

          if (!response.ok) throw new Error("Network response was not ok");

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let pending = "";

          while (true) {
            const { done, value } = await reader.read();
            pending += value ? decoder.decode(value, { stream: true }) : "";
            if (done) pending += decoder.decode();

            let newlineIndex;
            while ((newlineIndex = pending.indexOf("\n")) >= 0) {
              const line = pending.slice(0, newlineIndex);
              pending = pending.slice(newlineIndex + 1);
              if (line.startsWith("data: ")) {
                const data = line.slice(6);
                if (data === "[DONE]") {
                  // 移除光标
                  aiContentSpan.nextElementSibling?.remove();
                  isGenerating = false;
                  sendBtn.disabled = false;
                  sendBtn.classList.remove("opacity-50");
                  continue;
                }
                try {
                  fullText += JSON.parse(data);
                } catch {
                  fullText += data;
                }
                aiContentSpan.textContent = fullText;
                scrollToBottom();
              }
            }
            if (done) break;
          }
          history.push({ role: "assistant", content: fullText });
        } catch (error) {
          console.error("Error:", error);
          aiContentSpan.textContent = "抱歉，连接出现错误，请稍后重试。";
          aiContentSpan.nextElementSibling?.remove();
          isGenerating = false;
          sendBtn.disabled = false;
          sendBtn.classList.remove("opacity-50");
        }
      });
    </script>
  </body>
</html>
